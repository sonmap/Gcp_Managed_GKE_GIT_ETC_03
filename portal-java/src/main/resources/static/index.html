<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>데이터레이크 분석과제 포털 PoC</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 32px auto; padding: 0 20px; background:#f6f8fb; }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); margin-bottom:18px; }
    textarea { width:100%; min-height:260px; font-family:monospace; font-size:14px; }
    button { padding:12px 20px; border:0; border-radius:8px; background:#1769e0; color:white; cursor:pointer; margin-right:8px; }
    input { padding:10px; width:75%; }
    pre { background:#111827; color:#e5e7eb; padding:16px; border-radius:8px; overflow:auto; min-height:80px; }
    .flow { font-weight:700; color:#244d91; }
  </style>
</head>
<body>
  <h1>VM-less 분석과제 신청 PoC</h1>
  <p class="flow">Java Portal → Cloud Run Adapter → Infrastructure Manager → Terraform → BigQuery Dataset</p>

  <div class="card">
    <h2>과제 신청 JSON</h2>
    <p>PoC에서는 아래 JSON을 Java가 해석/변환하지 않고 Cloud Run 어댑터로 그대로 전달합니다.</p>
    <textarea id="payload">{
  "taskId": "task-001",
  "taskName": "analysis-demo-001",
  "group": "a",
  "targetProjectId": "CHANGE-ME",
  "location": "asia-northeast3"
}</textarea>
    <p><button onclick="deploy()">승인/배포 요청</button></p>
  </div>

  <div class="card">
    <h2>Infrastructure Manager 상태</h2>
    <input id="operation" placeholder="operations/... 또는 projects/.../locations/.../operations/..."/>
    <button onclick="statusCheck()">상태 조회</button>
  </div>

  <div class="card">
    <h2>응답</h2>
    <pre id="result">대기 중...</pre>
  </div>

<script>
async function deploy() {
  const result = document.getElementById('result');
  try {
    const body = document.getElementById('payload').value;
    const r = await fetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body});
    const text = await r.text();
    result.textContent = text;
    try {
      const obj = JSON.parse(text);
      if (obj.operation) document.getElementById('operation').value = obj.operation;
      if (obj.name && obj.name.includes('/operations/')) document.getElementById('operation').value = obj.name;
    } catch(e) {}
  } catch(e) { result.textContent = e.toString(); }
}
async function statusCheck() {
  const op = document.getElementById('operation').value;
  const r = await fetch('/api/infra/status?operation=' + encodeURIComponent(op));
  document.getElementById('result').textContent = await r.text();
}
</script>
</body>
</html>
