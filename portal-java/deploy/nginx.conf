server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/datalake-portal.access.log;
    error_log  /var/log/nginx/datalake-portal.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # The first task request can provision the shared GKE Autopilot
        # foundation through Infrastructure Manager before the task blueprint.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
