<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>데이터레이크 분석과제 포털 PoC</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 32px auto; padding: 0 20px; background:#f6f8fb; }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); margin-bottom:18px; }
    textarea { width:100%; min-height:230px; font-family:monospace; font-size:14px; box-sizing:border-box; }
    button { padding:12px 20px; border:0; border-radius:8px; background:#1769e0; color:white; cursor:pointer; margin-right:8px; }
    input { padding:10px; width:75%; box-sizing:border-box; }
    pre { background:#111827; color:#e5e7eb; padding:16px; border-radius:8px; overflow:auto; min-height:80px; white-space:pre-wrap; }
    .flow { font-weight:700; color:#244d91; }
    .summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-top:14px; }
    .metric { background:#f3f6fb; padding:14px; border-radius:8px; }
    .metric span { display:block; color:#6b7280; font-size:12px; margin-bottom:6px; }
    .metric strong { font-size:16px; word-break:break-word; }
    .ok { color:#15803d; }
    .running { color:#b45309; }
    .error { color:#b91c1c; }
    details { margin-top:16px; }
    @media (max-width: 800px) { .summary { grid-template-columns:1fr 1fr; } input { width:100%; margin-bottom:8px; } }
  </style>
</head>
<body>
  <h1>VM-less 분석과제 신청 PoC</h1>
  <p class="flow">Java Portal → Cloud Run Adapter → Infrastructure Manager → Terraform → BigQuery Dataset</p>

  <div class="card">
    <h2>과제 신청 JSON</h2>
    <p>기존 Java 요청 JSON은 변경하지 않고 Cloud Run 어댑터로 그대로 전달합니다.</p>
    <textarea id="payload">{
  "taskId": "task-004",
  "taskName": "analysis-task-004",
  "group": "a",
  "targetProjectId": "dev-com-334508",
  "location": "asia-northeast3"
}</textarea>
    <p><button onclick="deploy()">승인/배포 요청</button></p>
  </div>

  <div class="card">
    <h2>Infrastructure Manager 상태</h2>
    <input id="operation" placeholder="projects/.../locations/.../operations/..."/>
    <button onclick="statusCheck()">상태 조회</button>
  </div>

  <div class="card">
    <h2>처리 결과</h2>
    <div class="summary">
      <div class="metric"><span>배포 결과</span><strong id="resultStatus">대기 중</strong></div>
      <div class="metric"><span>과제 ID</span><strong id="taskId">-</strong></div>
      <div class="metric"><span>Dataset</span><strong id="datasetId">-</strong></div>
      <div class="metric"><span>Infrastructure Manager</span><strong id="infraState">-</strong></div>
    </div>
    <details>
      <summary>원본 JSON 응답 보기</summary>
      <pre id="result">대기 중...</pre>
    </details>
  </div>

<script>
function setText(id, value, cls) {
  const el = document.getElementById(id);
  el.textContent = value ?? '-';
  el.className = cls || '';
}

function payloadObject() {
  try { return JSON.parse(document.getElementById('payload').value); }
  catch(e) { return {}; }
}

function showDeployResult(obj) {
  const payload = payloadObject();
  const mapped = obj.mappedVariables || {};
  const operation = obj.operation || obj.name || '';
  if (operation && operation.includes('/operations/')) document.getElementById('operation').value = operation;

  setText('taskId', mapped.task_id || payload.taskId || payload.task_id || '-');
  setText('datasetId', mapped.dataset_id || '-');

  if (obj.error) {
    setText('resultStatus', '요청 실패', 'error');
    setText('infraState', 'ERROR', 'error');
  } else {
    setText('resultStatus', '배포 요청 접수', 'running');
    setText('infraState', 'RUNNING', 'running');
  }
}

function showStatusResult(obj) {
  const response = obj.response || {};
  const metadata = obj.metadata || {};
  const step = metadata.deploymentMetadata?.step || '';
  const inputs = response.terraformBlueprint?.inputValues || {};
  const dataset = inputs.dataset_id?.inputValue;
  const task = inputs.task_id?.inputValue;

  if (task) setText('taskId', task);
  if (dataset) setText('datasetId', dataset);

  if (obj.error) {
    setText('resultStatus', '배포 실패', 'error');
    setText('infraState', 'ERROR', 'error');
  } else if (obj.done === true && step === 'SUCCEEDED') {
    setText('resultStatus', '배포 성공', 'ok');
    setText('infraState', response.state || 'ACTIVE', 'ok');
  } else if (obj.done === true) {
    setText('resultStatus', step || '완료', step === 'FAILED' ? 'error' : 'ok');
    setText('infraState', response.state || step || 'DONE');
  } else {
    setText('resultStatus', '배포 진행 중', 'running');
    setText('infraState', step || 'RUNNING', 'running');
  }
}

async function deploy() {
  const result = document.getElementById('result');
  setText('resultStatus', '요청 중...', 'running');
  try {
    const body = document.getElementById('payload').value;
    const r = await fetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body});
    const text = await r.text();
    result.textContent = text;
    try { showDeployResult(JSON.parse(text)); }
    catch(e) { setText('resultStatus', r.ok ? '응답 확인 필요' : '요청 실패', r.ok ? 'running' : 'error'); }
  } catch(e) {
    result.textContent = e.toString();
    setText('resultStatus', '통신 실패', 'error');
  }
}

async function statusCheck() {
  const result = document.getElementById('result');
  const op = document.getElementById('operation').value;
  setText('resultStatus', '상태 확인 중...', 'running');
  try {
    const r = await fetch('/api/infra/status?operation=' + encodeURIComponent(op));
    const text = await r.text();
    result.textContent = text;
    try { showStatusResult(JSON.parse(text)); }
    catch(e) { setText('resultStatus', r.ok ? '응답 확인 필요' : '조회 실패', r.ok ? 'running' : 'error'); }
  } catch(e) {
    result.textContent = e.toString();
    setText('resultStatus', '조회 통신 실패', 'error');
  }
}
</script>
</body>
</html>
